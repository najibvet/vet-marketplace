<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - VetBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <!-- Header Admin -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base flex items-center gap-2">🐾 VetBook Admin</h1>
      <p class="text-[10px] text-slate-400">Pusat Kendali & Verifikasi Transaksi</p>
    </div>
    <button onclick="loadDashboardData()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Ringkasan Keuangan Lengkap -->
    <section class="space-y-3">
      <!-- Hak Platform -->
      <div class="bg-white p-4 rounded-2xl border border-teal-200 shadow-sm">
        <p class="text-[11px] font-bold text-teal-700 uppercase tracking-wider">🏢 Hak Platform (15%)</p>
        <p id="total-platform" class="text-xl font-extrabold text-teal-900 mt-1">Rp 0</p>
      </div>

      <!-- Breakdown Hak Per Dokter -->
      <div class="grid grid-cols-2 gap-3">
        <!-- drh. Najib -->
        <div class="bg-white p-3.5 rounded-2xl border border-blue-200 shadow-sm">
          <p class="text-[11px] font-bold text-blue-800">👨‍⚕️ Hak drh. Najib (85%)</p>
          <p id="total-najib" class="text-base font-extrabold text-blue-900 mt-1">Rp 0</p>
        </div>

        <!-- drh. Bintang -->
        <div class="bg-white p-3.5 rounded-2xl border border-indigo-200 shadow-sm">
          <p class="text-[11px] font-bold text-indigo-800">👩‍⚕️ Hak drh. Bintang (85%)</p>
          <p id="total-bintang" class="text-base font-extrabold text-indigo-900 mt-1">Rp 0</p>
        </div>
      </div>
    </section>

    <!-- Daftar Transaksi Pasien -->
    <section class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-gray-900 text-sm">Daftar Transaksi Pasien</h2>
        <span id="trans-count" class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0 Data</span>
      </div>

      <div id="transactions-list" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs">Memuat data transaksi...</div>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDashboardData() {
      const listContainer = document.getElementById('transactions-list');
      const countBadge = document.getElementById('trans-count');

      try {
        const { data: trans, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!trans || trans.length === 0) {
          listContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">Belum ada transaksi.</div>`;
          countBadge.innerText = '0 Data';
          updateFinancialSummary([]);
          return;
        }

        countBadge.innerText = `${trans.length} Data`;
        updateFinancialSummary(trans);

        listContainer.innerHTML = trans.map(t => {
          const isLunas = (t.payment_status || '').toUpperCase() === 'PAID' || (t.payment_status || '').toUpperCase() === 'LUNAS';
          const total = Number(t.total_amount || 0);
          const platform = Math.round(total * 0.15);
          const doctor = total - platform;

          // Deteksi Dokter
          let targetDoc = 'drh. Najib';
          const detailLower = (t.service_detail || '').toLowerCase();
          if (detailLower.includes('bintang')) {
            targetDoc = 'drh. Bintang';
          }

          return `
            <div class="p-3 rounded-xl border ${isLunas ? 'border-teal-200 bg-teal-50/30' : 'border-amber-200 bg-amber-50/30'} space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-xs text-gray-900">${t.service_detail || 'Layanan Medis'}</h3>
                  <p class="text-[11px] text-gray-600">👤 <b>${t.client_name || '-'}</b> (${t.client_phone || '-'})</p>
                  <p class="text-[10px] text-gray-500">🐾 Pasien: ${t.pet_info || '-'}</p>
                  <p class="text-[10px] text-blue-700 font-semibold mt-0.5">🩺 Dokter Tujuan: ${targetDoc}</p>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${isLunas ? 'bg-teal-100 text-teal-800' : 'bg-amber-100 text-amber-800'}">
                  ${isLunas ? 'LUNAS' : 'PENDING'}
                </span>
              </div>

              <div class="flex justify-between items-center text-[11px] border-t border-b border-gray-100 py-1.5 my-1">
                <span class="font-semibold text-gray-700">Total: Rp ${total.toLocaleString('id-ID')}</span>
                <span class="text-gray-400 text-[10px]">(Hak Dr: Rp ${doctor.toLocaleString('id-ID')} | Adm: Rp ${platform.toLocaleString('id-ID')})</span>
              </div>

              <div class="flex gap-2 justify-end pt-1">
                ${t.proof_url ? `
                  <a href="${t.proof_url}" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-[10px] font-semibold px-2.5 py-1 rounded-lg border">
                    📷 Lihat Bukti TF
                  </a>
                ` : ''}

                ${!isLunas ? `
                  <button onclick="markAsPaid('${t.id}')" class="bg-teal-600 hover:bg-teal-700 text-white text-[10px] font-bold px-3 py-1 rounded-lg shadow-sm">
                    ✓ Konfirmasi Lunas
                  </button>
                ` : `
                  <span class="text-[10px] text-teal-700 font-bold flex items-center gap-1">
                    ✓ Pembayaran Diverifikasi
                  </span>
                `}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        listContainer.innerHTML = `<div class="text-center py-6 text-red-500 text-xs">Gagal memuat data: ${err.message}</div>`;
      }
    }

    async function markAsPaid(id) {
      if (!confirm('Apakah Anda yakin transaksi ini sudah lunas?')) return;

      const { error } = await supabaseClient
        .from('transactions')
        .update({ payment_status: 'PAID', status: 'completed' })
        .eq('id', id);

      if (error) {
        alert('Gagal mengonfirmasi: ' + error.message);
      } else {
        alert('Transaksi berhasil dikonfirmasi LUNAS!');
        loadDashboardData();
      }
    }

    function updateFinancialSummary(transList) {
      let totalPlatform = 0;
      let totalNajib = 0;
      let totalBintang = 0;

      transList.forEach(t => {
        const isLunas = (t.payment_status || '').toUpperCase() === 'PAID' || (t.payment_status || '').toUpperCase() === 'LUNAS';
        if (isLunas) {
          const total = Number(t.total_amount || 0);
          const platform = Math.round(total * 0.15);
          const doctorShare = total - platform;

          totalPlatform += platform;

          // Pembagian Hak Berdasarkan Dokter Tujuan
          const detailLower = (t.service_detail || '').toLowerCase();
          if (detailLower.includes('bintang')) {
            totalBintang += doctorShare;
          } else {
            // Secara default/umum masuk ke drh. Najib
            totalNajib += doctorShare;
          }
        }
      });

      document.getElementById('total-platform').innerText = `Rp ${totalPlatform.toLocaleString('id-ID')}`;
      document.getElementById('total-najib').innerText = `Rp ${totalNajib.toLocaleString('id-ID')}`;
      document.getElementById('total-bintang').innerText = `Rp ${totalBintang.toLocaleString('id-ID')}`;
    }

    loadDashboardData();
  </script>
</body>
</html>
