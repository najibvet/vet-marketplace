<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - VetBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <!-- Header Admin -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base flex items-center gap-2">🐾 VetBook Admin</h1>
      <p class="text-[10px] text-slate-400">Pusat Kendali & Verifikasi Transaksi</p>
    </div>
    <button onclick="loadDashboardData()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Ringkasan Keuangan -->
    <section class="space-y-3">
      <div class="bg-white p-4 rounded-2xl border border-teal-200 shadow-sm">
        <p class="text-[11px] font-bold text-teal-700 uppercase tracking-wider">🏢 Hak Platform (15%)</p>
        <p id="total-platform" class="text-xl font-extrabold text-teal-900 mt-1">Rp 0</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3.5 rounded-2xl border border-blue-200 shadow-sm">
          <p class="text-[11px] font-bold text-blue-800">👨‍⚕️ Hak drh. Najib (85%)</p>
          <p id="total-najib" class="text-base font-extrabold text-blue-900 mt-1">Rp 0</p>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-indigo-200 shadow-sm">
          <p class="text-[11px] font-bold text-indigo-800">👩‍⚕️ Hak drh. Bintang (85%)</p>
          <p id="total-bintang" class="text-base font-extrabold text-indigo-900 mt-1">Rp 0</p>
        </div>
      </div>
    </section>

    <!-- Daftar Transaksi Pasien -->
    <section class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-gray-900 text-sm">Daftar Transaksi Pasien</h2>
        <span id="trans-count" class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0 Data</span>
      </div>

      <div id="transactions-list" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs">Memuat data transaksi...</div>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Nomor WhatsApp Resmi Dokter Praktisi
    const DOCTOR_PHONE_NAJIB = '6281215667746';   // drh. Najib
    const DOCTOR_PHONE_BINTANG = '6281230722452'; // drh. Bintang

    async function loadDashboardData() {
      const listContainer = document.getElementById('transactions-list');
      const countBadge = document.getElementById('trans-count');

      try {
        const { data: trans, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!trans || trans.length === 0) {
          listContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">Belum ada transaksi di database.</div>`;
          countBadge.innerText = '0 Data';
          updateFinancialSummary([]);
          return;
        }

        countBadge.innerText = `${trans.length} Data`;
        updateFinancialSummary(trans);

        listContainer.innerHTML = trans.map(t => {
          const serviceName = t.service_detail || 'Layanan Medis';
          const clientName = t.client_name || '-';
          const clientPhone = t.client_phone || '-';
          const petInfo = t.pet_info || '-';
          const total = Number(t.total_amount || 0);
          
          const payStatus = (t.payment_status || t.status || 'PENDING').toUpperCase();
          const isLunas = payStatus === 'PAID' || payStatus === 'LUNAS' || payStatus === 'COMPLETED';

          const platform = Math.round(total * 0.15);
          const doctor = total - platform;

          // Deteksi Dokter dan Nomor WA yang Sesuai
          let targetDoc = 'drh. Najib';
          let docPhone = DOCTOR_PHONE_NAJIB;
          const detailLower = serviceName.toLowerCase();
          
          if (detailLower.includes('bintang')) {
            targetDoc = 'drh. Bintang';
            docPhone = DOCTOR_PHONE_BINTANG;
          }

          // Format nomor telepon Klien ke format Internasional (628...)
          let formattedClientPhone = clientPhone.replace(/\D/g, '');
          if (formattedClientPhone.startsWith('0')) {
            formattedClientPhone = '62' + formattedClientPhone.slice(1);
          }

          // Link Ruang Chat In-App 20 Menit
          const consultationLink = `https://najibvet.github.io/vet-marketplace/consultation.html?id=${t.id}`;

          // Format Pesan WA untuk Klien
          const waClientMsg = encodeURIComponent(
            `Halo Kak *${clientName}*, pembayaran untuk *${serviceName}* (Pasien: *${petInfo}*) telah dikonfirmasi LUNAS ✅.\n\nSesi konsultasi live chat 20 menit bersama *${targetDoc}* siap dimulai melalui tautan berikut:\n👉 ${consultationLink}\n\nSilakan klik link di atas untuk masuk ke ruang obrolan. Terima kasih!`
          );

          // Format Pesan WA untuk Dokter yang Bertugas
          const waDoctorMsg = encodeURIComponent(
            `Halo *${targetDoc}*, ada sesi konsultasi baru yang telah LUNAS ✅.\n\n👤 *Klien:* ${clientName}\n🐾 *Pasien:* ${petInfo}\n📋 *Layanan:* ${serviceName}\n\nSilakan masuk ke ruang obrolan melalui link berikut dan ubah opsi "Kirim sebagai" menjadi Dokter Praktisi:\n👉 ${consultationLink}`
          );

          return `
            <div class="p-3 rounded-xl border ${isLunas ? 'border-teal-200 bg-teal-50/30' : 'border-amber-200 bg-amber-50/30'} space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-xs text-gray-900">${serviceName}</h3>
                  <p class="text-[11px] text-gray-600">👤 <b>${clientName}</b> (${clientPhone})</p>
                  <p class="text-[10px] text-gray-500">🐾 Pasien: ${petInfo}</p>
                  <p class="text-[10px] text-blue-700 font-semibold mt-0.5">🩺 Dokter Bertugas: <b>${targetDoc}</b></p>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${isLunas ? 'bg-teal-100 text-teal-800' : 'bg-amber-100 text-amber-800'}">
                  ${isLunas ? 'LUNAS' : 'PENDING'}
                </span>
              </div>

              <div class="flex justify-between items-center text-[11px] border-t border-b border-gray-100 py-1.5 my-1">
                <span class="font-semibold text-gray-700">Total: Rp ${total.toLocaleString('id-ID')}</span>
                <span class="text-gray-400 text-[10px]">(Dr: Rp ${doctor.toLocaleString('id-ID')} | Adm: Rp ${platform.toLocaleString('id-ID')})</span>
              </div>

              <div class="flex flex-col gap-1.5 pt-1">
                ${!isLunas ? `
                  <button onclick="markAsPaid('${t.id}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-[11px] font-bold py-2 rounded-lg shadow-sm">
                    ✓ Konfirmasi Lunas
                  </button>
                ` : `
                  <div class="grid grid-cols-2 gap-1.5">
                    <a href="https://wa.me/${formattedClientPhone}?text=${waClientMsg}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold py-1.5 px-2 rounded-lg text-center shadow-sm flex items-center justify-center gap-1">
                      📱 Kirim Link ke Klien
                    </a>
                    <a href="https://wa.me/${docPhone}?text=${waDoctorMsg}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold py-1.5 px-2 rounded-lg text-center shadow-sm flex items-center justify-center gap-1">
                      🩺 Notifikasi ke Dokter
                    </a>
                  </div>
                `}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        listContainer.innerHTML = `<div class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs">Gagal memuat data: ${err.message}</div>`;
      }
    }

    async function markAsPaid(id) {
      if (!confirm('Apakah Anda yakin transaksi ini sudah lunas?')) return;

      const { error } = await supabaseClient
        .from('transactions')
        .update({ payment_status: 'PAID', status: 'completed' })
        .eq('id', id);

      if (error) {
        alert('Gagal mengonfirmasi: ' + error.message);
      } else {
        alert('Transaksi LUNAS! Tombol kirim link ke Klien dan WhatsApp Dokter kini aktif.');
        loadDashboardData();
      }
    }

    function updateFinancialSummary(transList) {
      let totalPlatform = 0;
      let totalNajib = 0;
      let totalBintang = 0;

      transList.forEach(t => {
        const payStatus = (t.payment_status || t.status || 'PENDING').toUpperCase();
        const isLunas = payStatus === 'PAID' || payStatus === 'LUNAS' || payStatus === 'COMPLETED';

        if (isLunas) {
          const total = Number(t.total_amount || 0);
          const platform = Math.round(total * 0.15);
          const doctorShare = total - platform;

          totalPlatform += platform;

          const serviceName = (t.service_detail || '').toLowerCase();
          if (serviceName.includes('bintang')) {
            totalBintang += doctorShare;
          } else {
            totalNajib += doctorShare;
          }
        }
      });

      document.getElementById('total-platform').innerText = `Rp ${totalPlatform.toLocaleString('id-ID')}`;
      document.getElementById('total-najib').innerText = `Rp ${totalNajib.toLocaleString('id-ID')}`;
      document.getElementById('total-bintang').innerText = `Rp ${totalBintang.toLocaleString('id-ID')}`;
    }

    loadDashboardData();
  </script>
</body>
</html>
