<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <header class="bg-teal-900 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <h1 class="text-lg font-bold flex items-center gap-2">👨‍⚕️ Dashboard Dokter & Admin</h1>
    <button onclick="loadTransactions()" class="bg-teal-700 hover:bg-teal-600 text-xs px-3 py-1.5 rounded-lg border border-teal-500 font-medium">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
      <div>
        <p class="text-xs text-gray-500">Total Transaksi Pasien</p>
        <p id="total-count" class="text-xl font-bold text-teal-800">0</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-500">Status Sistem</p>
        <span class="inline-flex items-center gap-1.5 text-xs text-emerald-600 font-semibold bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Terhubung Supabase
        </span>
      </div>
    </div>

    <div class="space-y-3">
      <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Daftar Booking Pasien</h2>
      <div id="transactions-list" class="space-y-3">
        <div class="text-center py-8 text-gray-400 text-xs">Memuat daftar transaksi...</div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTransactions() {
      const container = document.getElementById('transactions-list');
      const countEl = document.getElementById('total-count');

      const { data: transactions, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl text-xs text-center">Gagal memuat data. Periksa akses RLS tabel transactions di Supabase.</div>`;
        return;
      }

      if (!transactions || transactions.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-gray-400 text-xs border border-gray-200">Belum ada booking pasien masuk.</div>`;
        countEl.innerText = '0';
        return;
      }

      countEl.innerText = transactions.length;

      container.innerHTML = transactions.map(item => {
        // Bersihkan format nomor HP untuk tautan WhatsApp
        let phone = item.client_phone || '';
        if (phone.startsWith('0')) {
          phone = '62' + phone.slice(1);
        }

        return `
          <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
            <div class="flex justify-between items-start border-b border-gray-100 pb-2">
              <div>
                <p class="font-bold text-sm text-gray-900">${item.client_name || 'Tanpa Nama'}</p>
                <p class="text-xs text-teal-700 font-semibold mt-0.5">🐾 ${item.pet_info || '-'}</p>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${
                item.status === 'completed' 
                  ? 'bg-emerald-100 text-emerald-800' 
                  : 'bg-amber-100 text-amber-800'
              }">
                ${item.status === 'completed' ? '✓ Selesai' : '⏳ Pending'}
              </span>
            </div>

            <div class="text-xs space-y-1 text-gray-600">
              <p><span class="font-semibold text-gray-500">Layanan:</span> ${item.service_detail || '-'}</p>
              <p><span class="font-semibold text-gray-500">No. HP:</span> ${item.client_phone || '-'}</p>
              <p><span class="font-semibold text-gray-500">Biaya:</span> Rp ${Number(item.total_amount || 0).toLocaleString('id-ID')}</p>
              <p><span class="font-semibold text-gray-500">Waktu:</span> ${new Date(item.created_at).toLocaleString('id-ID')}</p>
            </div>

            <div class="pt-1 flex gap-2">
              ${phone ? `
                <a href="https://wa.me/${phone}?text=Halo\%20${encodeURIComponent(item.client_name)},%20menanggapi%20pendaftaran%20untuk%20hewan%20Anda..." target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2 rounded-lg text-center transition">
                  💬 Chat WhatsApp
                </a>
              ` : ''}
              
              ${item.status !== 'completed' ? `
                <button onclick="updateStatus('${item.id}', 'completed')" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white font-semibold text-xs py-2 rounded-lg transition">
                  Tandai Selesai
                /button>
              ` : `
                <button onclick="updateStatus('${item.id}', 'pending')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-xs py-2 rounded-lg transition">
                  Ubah ke Pending
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      const { error } = await supabaseClient
        .from('transactions')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert('Gagal mengupdate status: ' + error.message);
      } else {
        loadTransactions();
      }
    }

    loadTransactions();
  </script>
</body>
</html>
