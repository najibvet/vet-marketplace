<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Rekam Medis Pasien</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <a href="admin.html" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      ← Kembali ke Admin
    </a>
    <h1 class="font-bold text-base">📋 Rekam Medis (EHR)</h1>
    <div class="w-16"></div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Form Input Rekam Medis Baru -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
      <h2 class="font-bold text-gray-900 text-sm border-b pb-2">Catat Pemeriksaan Baru</h2>
      
      <form id="record-form" onsubmit="saveMedicalRecord(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pemilik / Klien</label>
          <input type="text" id="rec-client" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Budi Santoso">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Anabul & Jenis Hewan</label>
          <input type="text" id="rec-pet" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Miko (Kucing)">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Diagnosa / Anamnesa</label>
          <textarea id="rec-diagnosis" required rows="2" class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Flea allergy dermatitis, gatal ringan..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tindakan & Resep Obat</label>
          <textarea id="rec-treatment" required rows="2" class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Injeksi antiparasit, salep topikal..."></textarea>
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm">
          Simpan Rekam Medis
        </button>
      </form>
    </div>

    <!-- Riwayat Rekam Medis -->
    <div class="space-y-3">
      <h2 class="font-bold text-gray-900 text-sm uppercase tracking-wider px-1">Riwayat Pasien</h2>
      <div id="records-container" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Memuat riwayat...</div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadRecords() {
      const container = document.getElementById('records-container');
      
      // Ambil data dari tabel medical_records (pastikan tabel sudah dibuat atau kita gunakan tabel transaksi sementara)
      const { data: recs, error } = await supabaseClient
        .from('medical_records')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !recs || recs.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs border">Belum ada catatan rekam medis tersimpan.</div>`;
        return;
      }

      container.innerHTML = recs.map(r => `
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-2">
          <div class="flex justify-between items-start border-b pb-2">
            <div>
              <h3 class="font-bold text-sm text-gray-900">${r.pet_name} <span class="text-gray-500 font-normal">(${r.client_name})</span></h3>
              <p class="text-[10px] text-gray-400">${new Date(r.created_at).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}</p>
            </div>
          </div>
          <div class="text-xs space-y-1">
            <p><strong>Diagnosa:</strong> <span class="text-gray-700">${r.diagnosis}</span></p>
            <p><strong>Tindakan/Resep:</strong> <span class="text-teal-700 font-medium">${r.treatment}</span></p>
          </div>
        </div>
      `).join('');
    }

    async function saveMedicalRecord(e) {
      e.preventDefault();
      const clientName = document.getElementById('rec-client').value;
      const petName = document.getElementById('rec-pet').value;
      const diagnosis = document.getElementById('rec-diagnosis').value;
      const treatment = document.getElementById('rec-treatment').value;

      const { error } = await supabaseClient.from('medical_records').insert([
        { client_name: clientName, pet_name: petName, diagnosis: diagnosis, treatment: treatment }
      ]);

      if (error) {
        alert('Gagal menyimpan rekam medis. Pastikan tabel medical_records sudah dibuat di Supabase.\nError: ' + error.message);
        return;
      }

      alert('Rekam medis berhasil disimpan!');
      document.getElementById('record-form').reset();
      loadRecords();
    }

    loadRecords();
  </script>
</body>
</html>
