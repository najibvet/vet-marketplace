<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Dokter - VetBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <!-- Header Nav -->
  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex items-center justify-between">
    <a href="index.html" class="text-sm font-semibold flex items-center gap-1 bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      ← Kembali ke Beranda
    </a>
    <h1 class="font-bold text-base">Profil Dokter</h1>
    <div class="w-16"></div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Info Detail Dokter -->
    <div id="doctor-profile" class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center space-y-3">
      <div class="w-24 h-24 mx-auto rounded-full bg-gray-200 overflow-hidden shadow-inner border-2 border-teal-500">
        <img id="doc-avatar" src="" alt="Foto Dokter" class="w-full h-full object-cover">
      </div>
      <div>
        <h2 id="doc-name" class="text-xl font-bold text-gray-900">Memuat...</h2>
        <p id="doc-title" class="text-teal-700 font-medium text-sm mt-0.5">-</p>
        <p id="doc-city" class="text-gray-400 text-xs mt-1">📍 -</p>
      </div>
    </div>

    <!-- Layanan Dokter Terkait -->
    <div class="space-y-3">
      <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wider px-1">Layanan Tersedia</h3>
      <div id="doctor-services" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Memuat layanan...</div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil parameter ID dokter dari URL (contoh: doctor.html?id=UUID)
    const urlParams = new URLSearchParams(window.location.search);
    const vetId = urlParams.get('id');

    async function loadDoctorProfile() {
      if (!vetId) {
        document.getElementById('doctor-profile').innerHTML = `<p class="text-red-500 text-sm">Dokter tidak ditemukan.</p>`;
        return;
      }

      // 1. Ambil data dokter
      const { data: vet, error: vetError } = await supabaseClient
        .from('vets')
        .select('*')
        .eq('id', vetId)
        .single();

      if (vetError || !vet) {
        document.getElementById('doctor-profile').innerHTML = `<p class="text-red-500 text-sm">Profil dokter gagal dimuat.</p>`;
        return;
      }

      // Render info dokter
      document.getElementById('doc-name').innerText = vet.full_name;
      document.getElementById('doc-title').innerText = vet.title || 'Praktisi Medis';
      document.getElementById('doc-city').innerText = `📍 ${vet.city || 'Indonesia'}`;
      
      const avatarImg = document.getElementById('doc-avatar');
      avatarImg.src = vet.avatar_url && vet.avatar_url.trim() !== '' 
        ? vet.avatar_url 
        : 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=300'; // Default placeholder

      // 2. Ambil layanan milik dokter ini
      const { data: services, error: srvError } = await supabaseClient
        .from('services')
        .select('*')
        .eq('vet_id', vetId);

      const srvContainer = document.getElementById('doctor-services');

      if (srvError || !services || services.length === 0) {
        srvContainer.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs border">Belum ada layanan aktif untuk dokter ini.</div>`;
        return;
      }

      srvContainer.innerHTML = services.map(s => `
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center">
          <div>
            <h4 class="font-bold text-sm text-gray-900">${s.title}</h4>
            <p class="text-teal-700 font-bold text-sm mt-1">Rp ${Number(s.price).toLocaleString('id-ID')}</p>
          </div>
          <a href="index.html" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-4 py-2 rounded-xl transition font-medium shadow-sm">
            Pilih
          </a>
        </div>
      `).join('');
    }

    loadDoctorProfile();
  </script>
</body>
  </html>
