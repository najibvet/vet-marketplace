<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Konsultasi Live - VetBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <!-- Header Clean -->
  <header class="bg-teal-700 text-white p-3 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-sm flex items-center gap-1.5">🐾 Ruang Konsultasi Medis</h1>
      <p id="service-title-header" class="text-[11px] text-teal-100">Memuat rincian...</p>
    </div>
    <!-- Indikator Waktu / Status Sesi -->
    <div class="bg-teal-900/60 border border-teal-400/40 rounded-xl px-2.5 py-1 text-center min-w-[80px]">
      <p id="timer-label" class="text-[9px] text-teal-200 uppercase tracking-wider font-semibold">Sisa Waktu</p>
      <div id="timer-display" class="text-sm font-black text-amber-300 font-mono">20:00</div>
    </div>
  </header>

  <!-- Banner Info Pasien & Status Peran -->
  <div class="bg-amber-50 border-b border-amber-200 px-4 py-2 text-[11px] flex justify-between items-center text-amber-900 sticky top-[57px] z-10">
    <div>
      <span>👤 <b id="info-client">Klien</b></span> | <span>🐾 <b id="info-pet">Pasien</b></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="role-badge" class="bg-teal-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Memuat...</span>
      <button onclick="endSession()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-2 py-0.5 rounded-lg text-[10px]">
        Tutup
      </button>
    </div>
  </div>

  <!-- Area Chat Message -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 overflow-y-auto space-y-3 mb-16" id="chat-box">
    <div class="text-center py-12 text-xs text-gray-400">Menghubungkan ke ruang obrolan...</div>
  </main>

  <!-- Form Input Pesan -->
  <footer class="bg-white border-t border-gray-200 p-3 fixed bottom-0 left-0 right-0 z-20 shadow-lg">
    <div class="max-w-md mx-auto">
      <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
        <input type="text" id="chat-input" placeholder="Tulis pesan konsultasi di sini..." required class="flex-1 border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none"/>
        <button type="submit" id="send-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition active:scale-95 shadow-sm">
          Kirim
        </button>
      </form>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const transactionId = urlParams.get('id');
    const urlRole = urlParams.get('role'); // 'client' atau 'doctor'

    let clientName = 'Klien';
    let petInfo = 'Pasien';
    let doctorName = 'Dokter';

    // Peran Otomatis
    let activeSender = (urlRole === 'doctor') ? 'DOCTOR' : 'CLIENT';
    let activeSenderName = 'Klien';

    // Logika Timer Berdasarkan Peran
    const timerLabel = document.getElementById('timer-label');
    const timerDisplay = document.getElementById('timer-display');

    if (activeSender === 'DOCTOR') {
      // Tampilan Tanpa Batas Waktu untuk Dokter
      timerLabel.innerText = "Status Sesi";
      timerDisplay.innerText = "AKTIF 🟢";
      timerDisplay.className = "text-xs font-bold text-emerald-300 font-sans my-0.5";
    } else {
      // Timer Hitung Mundur 20 Menit untuk Klien
      let totalSeconds = 20 * 60;
      const countdown = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "HABIS";
          alert("Waktu konsultasi 20 menit telah berakhir.");
          document.getElementById('chat-input').disabled = true;
          document.getElementById('send-btn').disabled = true;
          return;
        }
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }, 1000);
    }

    async function initSession() {
      if (!transactionId) {
        document.getElementById('service-title-header').innerText = "Sesi Standar VetBook";
        setupRoleBadge();
        loadMessages();
        subscribeRealtimeMessages();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .eq('id', transactionId)
          .single();

        if (error) throw error;

        if (data) {
          clientName = data.client_name || 'Klien';
          petInfo = data.pet_info || 'Pasien';
          
          const detail = (data.service_detail || '').toLowerCase();
          doctorName = detail.includes('bintang') ? 'drh. Bintang' : 'drh. Najib';

          document.getElementById('service-title-header').innerText = data.service_detail || 'Konsultasi Medis';
          document.getElementById('info-client').innerText = clientName;
          document.getElementById('info-pet').innerText = petInfo;
        }
      } catch (err) {
        console.error("Gagal memuat detail:", err);
      }

      setupRoleBadge();
      loadMessages();
      subscribeRealtimeMessages();
    }

    function setupRoleBadge() {
      const badge = document.getElementById('role-badge');
      if (activeSender === 'DOCTOR') {
        activeSenderName = doctorName;
        badge.innerText = `🩺 ${doctorName}`;
        badge.className = "bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md";
      } else {
        activeSenderName = clientName;
        badge.innerText = `👤 ${clientName}`;
        badge.className = "bg-teal-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-md";
      }
    }

    async function loadMessages() {
      let query = supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
      if (transactionId) query = query.eq('transaction_id', transactionId);

      const { data, error } = await query;
      if (!error) renderMessages(data || []);
    }

    function renderMessages(msgList) {
      const chatBox = document.getElementById('chat-box');
      if (msgList.length === 0) {
        chatBox.innerHTML = `
          <div class="text-center py-12 space-y-2">
            <span class="bg-teal-100 text-teal-800 text-[10px] font-bold px-3 py-1 rounded-full">Sesi Obrolan Aktif</span>
            <p class="text-xs text-gray-400">Belum ada pesan. Silakan mulai percakapan.</p>
          </div>
        `;
        return;
      }

      chatBox.innerHTML = msgList.map(m => {
        const isMe = m.sender === activeSender;
        const timeStr = new Date(m.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1.5">
            <span class="text-[9px] text-gray-400 mb-0.5 px-1">${m.sender_name || m.sender} • ${timeStr}</span>
            <div class="max-w-[85%] px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-teal-600 text-white rounded-br-none shadow-sm' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none shadow-sm'}">
              ${m.text}
            </div>
          </div>
        `;
      }).join('');

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      const { error } = await supabaseClient.from('messages').insert([
        {
          transaction_id: transactionId || 'umum',
          sender: activeSender,
          sender_name: activeSenderName,
          text: text
        }
      ]);

      if (error) alert("Gagal mengirim pesan: " + error.message);
    }

    function subscribeRealtimeMessages() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          loadMessages();
        })
        .subscribe();
    }

    function endSession() {
      if (confirm("Apakah Anda ingin mengakhiri dan keluar dari sesi konsultasi ini?")) {
        window.location.href = "index.html";
      }
    }

    initSession();
  </script>
</body>
</html>
