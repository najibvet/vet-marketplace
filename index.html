<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Marketplace Dokter Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">🐾 VetBook</h1>
    <span class="bg-teal-800 text-xs px-2.5 py-1 rounded-full font-mono">v1.1 Booking</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    <!-- Bagian Direktori Dokter -->
    <div id="section-catalog">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-teal-900">Pilih Dokter Hewan</h2>
        <p class="text-xs text-gray-500">Direktori konsultasi & layanan medis hewan</p>
      </div>

      <div id="vets-container" class="space-y-4">
        <div class="text-center py-8 text-gray-400 text-sm">Memuat data dokter...</div>
      </div>
    </div>

    <!-- Bagian Form Booking -->
    <div id="section-booking" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-base font-bold text-teal-900">Formulir Pendaftaran Pasien</h2>
        <button onclick="batalBooking()" class="text-xs text-gray-400 hover:text-gray-600 font-medium">✕ Batal</button>
      </div>

      <div class="bg-teal-50 p-3 rounded-xl border border-teal-100 text-xs space-y-1">
        <p class="text-gray-500 font-medium">Layanan yang Dipilih:</p>
        <p id="selected-service-title" class="font-bold text-teal-900 text-sm">-</p>
        <p id="selected-service-price" class="font-bold text-teal-700">-</p>
      </div>

      <form id="booking-form" onsubmit="kirimBooking(event); return false;" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemilik / Client</label>
          <input type="text" id="owner-name" required placeholder="Contoh: Budi Santoso" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 focus:outline-none focus:border-teal-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">No. WhatsApp / HP</label>
          <input type="tel" id="owner-phone" required placeholder="Contoh: 081234567890" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 focus:outline-none focus:border-teal-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Hewan & Jenis (Anabul)</label>
          <input type="text" id="pet-info" required placeholder="Contoh: Miko (Kucing Persia)" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 focus:outline-none focus:border-teal-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Keluhan / Gejala Klinis</label>
          <textarea id="pet-complaint" rows="3" required placeholder="Ceritakan keluhan atau gejala sakit anabul..." class="w-full text-xs p-2.5 rounded-lg border border-gray-200 focus:outline-none focus:border-teal-600"></textarea>
        </div>

        <button type="submit" class="w-full bg-teal-600 text-white font-semibold text-xs py-3 rounded-xl hover:bg-teal-700 transition">
          Lanjut ke Konfirmasi WhatsApp ➔
        </button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeService = null;
    let activeDoctorName = '';

    async function loadVetsData() {
      const container = document.getElementById('vets-container');

      const { data: vets, error } = await supabaseClient
        .from('vets')
        .select(`
          id,
          full_name,
          title,
          city,
          avatar_url,
          services (
            id,
            title,
            price,
            category
          )
        `);

      if (error) {
        container.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl text-xs text-center">Gagal memuat data. Periksa koneksi Anda.</div>`;
        return;
      }

      if (!vets || vets.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 text-xs py-6">Belum ada dokter terdaftar.</div>`;
        return;
      }

      container.innerHTML = vets.map(vet => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
          <div class="flex items-center gap-4">
            <img src="${vet.avatar_url || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-full object-cover border-2 border-teal-500">
            <div>
              <h3 class="font-bold text-base text-gray-900">${vet.full_name}</h3>
              <p class="text-xs text-teal-600 font-semibold">${vet.title}</p>
              <p class="text-xs text-gray-400 mt-1">📍 ${vet.city}</p>
            </div>
          </div>

          <hr class="border-gray-100">

          <div class="space-y-2">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Layanan Tersedia</p>
            ${
              vet.services && vet.services.length > 0 
              ? vet.services.map(svc => `
                <div class="flex justify-between items-center bg-teal-50/50 p-3 rounded-xl border border-teal-100">
                  <div>
                    <p class="text-xs font-semibold text-gray-800">${svc.title}</p>
                    <p class="text-xs font-bold text-teal-700">Rp ${Number(svc.price).toLocaleString('id-ID')}</p>
                  </div>
                  <button onclick="pilihLayanan('${vet.full_name}', '${svc.title}',${svc.price})" class="bg-teal-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium hover:bg-teal-700">
                    Pilih
                  </button>
                </div>
              `).join('')
              : `<p class="text-xs text-gray-400 italic">Belum ada layanan.</p>`
            }
          </div>
        </div>
      `).join('');
    }

    function pilihLayanan(doctorName, serviceTitle, price) {
      activeDoctorName = doctorName;
      activeService = { title: serviceTitle, price: price };

      document.getElementById('selected-service-title').innerText = `${serviceTitle} (oleh ${doctorName})`;
      document.getElementById('selected-service-price').innerText = `Rp ${price.toLocaleString('id-ID')}`;

      document.getElementById('section-catalog').classList.add('hidden');
      document.getElementById('section-booking').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function batalBooking() {
      document.getElementById('section-booking').classList.add('hidden');
      document.getElementById('section-catalog').classList.remove('hidden');
    }

    async function kirimBooking(event) {
      event.preventDefault();

      const ownerName = document.getElementById('owner-name').value.trim();
      const ownerPhone = document.getElementById('owner-phone').value.trim();
      const petInfo = document.getElementById('pet-info').value.trim();
      const complaint = document.getElementById('pet-complaint').value.trim();

      if (!ownerName || !ownerPhone || !petInfo || !complaint) {
        alert('Mohon isi semua data formulir dengan lengkap.');
        return;
      }

      // 1. Simpan transaksi ke Supabase (Menambahkan platform_fee: 0 agar tidak error)
      const { error } = await supabaseClient
        .from('transactions')
        .insert([
          { 
            client_name: ownerName, 
            client_phone: ownerPhone, 
            pet_info: petInfo, 
            service_detail: `${activeService.title} - ${activeDoctorName} (Keluhan: ${complaint})`,
            total_amount: activeService.price,
            platform_fee: 0, 
            status: 'pending'
          }
        ]);

      if (error) {
        alert('Gagal Supabase: ' + error.message);
        return;
      }

      // 2. Format pesan WhatsApp otomatis ke nomor Anda
      const noAdminWhatsApp = '6281215667746'; 
      const pesan = `Halo ${activeDoctorName}, saya ingin mendaftarkan hewan peliharaan untuk konsultasi/layanan.%0A%0A*Detail Booking:*%0A- Layanan: ${activeService.title}%0A- Biaya: Rp ${activeService.price.toLocaleString('id-ID')}%0A- Nama Pemilik: ${ownerName}%0A- No. HP: ${ownerPhone}%0A- Nama Hewan: ${petInfo}%0A- Keluhan: ${complaint}%0A%0AMohon konfirmasinya, terima kasih!`;

      // 3. Arahkan ke WhatsApp
      window.location.href = `https://wa.me/${noAdminWhatsApp}?text=${pesan}`;
    }

    loadVetsData();
  </script>
</body>
  </html>
