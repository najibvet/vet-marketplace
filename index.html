<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Marketplace Dokter Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg">🐾 VetBook v2.0</h1>
      <p class="text-xs text-teal-100">Booking Konsultasi & Layanan Medis</p>
    </div>
    <a href="admin.html" class="bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium border border-teal-600">
      Admin Panel
    </a>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Bagian Daftar Dokter Tersedia -->
    <section class="space-y-3">
      <h2 class="font-bold text-gray-900 text-sm uppercase tracking-wider px-1">Dokter Praktisi</h2>
      <div id="vets-container" class="grid grid-cols-1 gap-3">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Memuat daftar dokter...</div>
      </div>
    </section>

    <!-- Bagian Layanan & Booking -->
    <section class="space-y-3">
      <h2 class="font-bold text-gray-900 text-sm uppercase tracking-wider px-1">Pilih Layanan Konsultasi</h2>
      <div id="services-container" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Memuat layanan...</div>
      </div>
    </section>

  </main>

  <!-- Modal Booking -->
  <div id="booking-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-service-title" class="font-bold text-gray-900 text-base">Formulir Booking</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
      </div>
      
      <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-3">
        <input type="hidden" id="selected-service-id">
        <input type="hidden" id="selected-service-price">
        <input type="hidden" id="selected-service-name">

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Klien / Pemilik</label>
          <input type="text" id="client-name" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Budi Santoso">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">No. WhatsApp (Aktif)</label>
          <input type="tel" id="client-phone" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: 081234567890">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama & Jenis Anabul / Pasien</label>
          <input type="text" id="pet-info" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Cth: Miko (Kucing Persia)">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Unggah Bukti Transfer (Opsional)</label>
          <input type="file" id="booking-proof" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 border border-gray-200 rounded-xl p-1"/>
          <p class="text-[10px] text-gray-400 mt-1">Format gambar (JPG/PNG).</p>
        </div>

        <div class="pt-2">
          <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm">
            Konfirmasi & Kirim Pesanan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadMarketplaceData() {
      const vetContainer = document.getElementById('vets-container');
      const srvContainer = document.getElementById('services-container');

      try {
        // 1. Ambil Data Dokter
        const { data: vets, error: vetErr } = await supabaseClient.from('vets').select('*');
        if (!vetErr && vets && vets.length > 0) {
          vetContainer.innerHTML = vets.map(v => `
            <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
              <div class="flex items-center gap-3">
                <img src="${v.avatar_url || 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=100'}" class="w-12 h-12 rounded-full object-cover border border-teal-500">
                <div>
                  <h3 class="font-bold text-sm text-gray-900">${v.full_name || 'Dokter'}</h3>
                  <p class="text-teal-700 text-[11px] font-medium">${v.title || 'Dokter Hewan'}</p>
                  <p class="text-gray-400 text-[10px]">📍 ${v.city || 'Indonesia'}</p>
                </div>
              </div>
              <a href="doctor.html?id=${v.id}" class="bg-gray-100 hover:bg-teal-50 text-teal-700 text-xs px-3 py-1.5 rounded-xl font-medium transition border border-gray-200">
                Profil
              </a>
            </div>
          `).join('');
        } else {
          vetContainer.innerHTML = `<div class="bg-white p-4 rounded-2xl text-center text-gray-400 text-xs">Belum ada dokter terdaftar.</div>`;
        }

        // 2. Ambil Data Layanan (Tanpa join ketat agar tidak macet jika relasi kosong)
        const { data: services, error: srvErr } = await supabaseClient.from('services').select('*');
        if (!srvErr && services && services.length > 0) {
          srvContainer.innerHTML = services.map(s => `
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-sm text-gray-900">${s.title || 'Layanan Konsultasi'}</h3>
                  <p class="text-xs text-teal-700 font-medium mt-0.5">Layanan Medis Veteriner</p>
                </div>
                <span class="bg-teal-50 text-teal-800 font-bold text-xs px-2.5 py-1 rounded-lg">
                  Rp ${Number(s.price || 50000).toLocaleString('id-ID')}
                </span>
              </div>
              <button onclick="openModal('${s.id}', '${s.title || 'Konsultasi'}', ${s.price || 50000})" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded-xl text-xs transition shadow-sm">
                Booking Sekarang
              </button>
            </div>
          `).join('');
        } else {
          // Fallback layanan default jika tabel services kosong
          srvContainer.innerHTML = `
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-sm text-gray-900">TeleVet (Pet n Poultry) - drh. Najib</h3>
                  <p class="text-xs text-teal-700 font-medium mt-0.5">Konsultasi Online</p>
                </div>
                <span class="bg-teal-50 text-teal-800 font-bold text-xs px-2.5 py-1 rounded-lg">
                  Rp 50.000
                </span>
              </div>
              <button onclick="openModal('default-1', 'TeleVet (Pet n Poultry) - drh. Najib', 50000)" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded-xl text-xs transition shadow-sm">
                Booking Sekarang
              </button>
            </div>
          `;
        }

      } catch (err) {
        console.error("Error loading data:", err);
        srvContainer.innerHTML = `<div class="bg-white p-4 rounded-2xl text-center text-red-400 text-xs">Gagal memuat data. Periksa koneksi database.</div>`;
      }
    }

    function openModal(id, title, price) {
      document.getElementById('selected-service-id').value = id;
      document.getElementById('selected-service-name').value = title;
      document.getElementById('selected-service-price').value = price;
      document.getElementById('modal-service-title').innerText = "Booking: " + title;
      document.getElementById('booking-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.add('hidden');
    }

    async function submitBooking(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "Mengunggah & Menyimpan...";
      submitBtn.disabled = true;

      const serviceId = document.getElementById('selected-service-id').value;
      const serviceDetail = document.getElementById('selected-service-name').value;
      const amount = Number(document.getElementById('selected-service-price').value);
      const clientName = document.getElementById('client-name').value;
      const clientPhone = document.getElementById('client-phone').value;
      const petInfo = document.getElementById('pet-info').value;
      const proofFile = document.getElementById('booking-proof').files[0];

      const platformFee = Math.round(amount * 0.15);
      let proofUrl = null;

      try {
        // Jika ada file bukti transfer
        if (proofFile) {
          const fileExt = proofFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
          
          const { error: uploadError } = await supabaseClient.storage
            .from('proofs')
            .upload(fileName, proofFile);

          if (uploadError) {
            alert('Gagal mengunggah bukti transfer: ' + uploadError.message);
            submitBtn.innerText = "Konfirmasi & Kirim Pesanan";
            submitBtn.disabled = false;
            return;
          }

          const { data: urlData } = supabaseClient.storage
            .from('proofs')
            .getPublicUrl(fileName);
            
          proofUrl = urlData.publicUrl;
        }

        // Simpan transaksi
        const { error } = await supabaseClient.from('transactions').insert([
          {
            service_id: serviceId,
            service_detail: serviceDetail,
            total_amount: amount,
            platform_fee: platformFee,
            client_name: clientName,
            client_phone: clientPhone,
            pet_info: petInfo,
            payment_status: 'PENDING',
            status: 'pending',
            proof_url: proofUrl
          }
        ]);

        if (error) {
          alert('Gagal membuat pesanan: ' + error.message);
          submitBtn.innerText = "Konfirmasi & Kirim Pesanan";
          submitBtn.disabled = false;
          return;
        }

        alert('Pesanan berhasil dibuat! Anda akan diarahkan ke WhatsApp.');
        
        const adminPhone = '6281215667746';
        let waText = `Halo Admin VetBook, saya ingin konfirmasi booking layanan:\n\n*Layanan:* ${serviceDetail}\n*Nama:* ${clientName} (${clientPhone})\n*Pasien:* ${petInfo}\n*Total Biaya:* Rp ${amount.toLocaleString('id-ID')}\n`;
        
        if (proofUrl) {
          waText += `*Bukti Transfer:* ${proofUrl}\n`;
        }
        
        waText += `\nMohon verifikasi pembayarannya. Terima kasih.`;
        
        window.location.href = `https://wa.me/${adminPhone}?text=${encodeURIComponent(waText)}`;

      } catch (err) {
        alert('Terjadi kesalahan sistem: ' + err.message);
        submitBtn.innerText = "Konfirmasi & Kirim Pesanan";
        submitBtn.disabled = false;
      }
    }

    // Jalankan pemuatan data awal
    loadMarketplaceData();
  </script>
</body>
    </html>
