<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Dokter - VetBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base">🐾 Dompet Dokter</h1>
      <p class="text-[10px] text-teal-100">Portal Keuangan & Pencairan Komisi</p>
    </div>
    <div class="flex gap-2">
      <a href="index.html" class="bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-lg border border-teal-600">
        ← Beranda
      </a>
      <button onclick="loadDoctorWallet()" class="bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-lg border border-teal-600">
        🔄 Refresh
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Pilih Profil Dokter -->
    <div class="bg-white p-3 rounded-2xl border border-teal-200 shadow-sm flex items-center justify-between">
      <span class="text-xs font-bold text-gray-700">Pilih Akun Dokter:</span>
      <select id="doctor-selector" onchange="switchDoctorAccount()" class="border border-teal-300 rounded-xl px-3 py-1.5 text-xs font-bold text-teal-900 bg-teal-50 focus:outline-none focus:ring-2 focus:ring-teal-500">
        <option value="najib">drh. Najib</option>
        <option value="bintang">drh. Bintang</option>
      </select>
    </div>

    <!-- Kotak Ringkasan Hak Komisi Dokter Terpilih -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3.5 rounded-2xl border border-teal-200 shadow-sm">
        <p id="label-doctor-name" class="text-[11px] font-bold text-teal-800">Hak Pendapatan</p>
        <p id="doc-balance" class="text-lg font-extrabold text-teal-900 mt-1">Rp 0</p>
        <p id="doc-withdrawn" class="text-[10px] text-gray-400 mt-0.5">Tercairkan: Rp 0</p>
      </div>

      <div class="bg-white p-3.5 rounded-2xl border border-blue-200 shadow-sm flex flex-col justify-between">
        <div>
          <p class="text-[11px] font-bold text-blue-800">Status Komisi</p>
          <p class="text-xs font-semibold text-blue-900 mt-1">85% dari Layanan</p>
        </div>
        <span class="text-[9px] text-gray-400">Otomatis Terhitung Sistem</span>
      </div>
    </section>

    <!-- Form Pengajuan Penarikan -->
    <section class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
      <h2 class="font-bold text-gray-900 text-xs border-b pb-2">Formulir Pencairan Komisi</h2>
      
      <form onsubmit="submitWithdrawal(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">Nama Lengkap & Gelar Dokter</label>
          <input type="text" id="input-name" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none bg-gray-50 font-medium" />
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">Nominal Penarikan (Rp)</label>
          <input type="number" id="input-amount" placeholder="Cth: 50000" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">Tujuan Transfer (Bank / e-Wallet & No. Rekening)</label>
          <input type="text" id="input-bank" placeholder="Cth: BCA 1234567890 a.n. Dokter" required class="w-full border rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" />
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
          💸 Ajukan Penarikan Dana
        </button>
      </form>
    </section>

    <!-- Riwayat Penarikan Database -->
    <section class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-gray-900 text-xs">Riwayat Penarikan Saya</h2>
        <span id="history-count" class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0 Data</span>
      </div>

      <div id="withdrawal-history" class="space-y-2">
        <div class="text-center py-4 text-gray-400 text-xs">Memuat riwayat...</div>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalTransactions = [];
    let globalWithdrawals = [];

    // Deteksi dokter aktif berdasarkan dropdown
    function getSelectedDoctorKey() {
      return document.getElementById('doctor-selector').value; // 'najib' atau 'bintang'
    }

    function switchDoctorAccount() {
      const key = getSelectedDoctorKey();
      const nameInput = document.getElementById('input-name');
      const labelName = document.getElementById('label-doctor-name');

      if (key === 'bintang') {
        nameInput.value = 'drh. Bintang Pertama';
        labelName.innerText = 'Sisa Hak drh. Bintang';
      } else {
        nameInput.value = 'drh. Najib';
        labelName.innerText = 'Sisa Hak drh. Najib';
      }
      calculateDoctorStats();
      loadMyWithdrawals();
    }

    async function loadDoctorWallet() {
      try {
        // Ambil data transaksi
        const { data: trans } = await supabaseClient.from('transactions').select('*');
        globalTransactions = trans || [];

        // Ambil data penarikan
        const { data: wList } = await supabaseClient.from('withdrawals').select('*').order('created_at', { ascending: false });
        globalWithdrawals = wList || [];

        switchDoctorAccount();
      } catch (err) {
        console.error("Gagal memuat dompet:", err);
      }
    }

    function calculateDoctorStats() {
      const key = getSelectedDoctorKey();
      let gross = 0;

      // Hitung total hak kotor (85%) dari transaksi lunas
      globalTransactions.forEach(t => {
        const payStatus = (t.payment_status || t.status || 'PENDING').toUpperCase();
        const isLunas = payStatus === 'PAID' || payStatus === 'LUNAS' || payStatus === 'COMPLETED';

        if (isLunas) {
          const total = Number(t.total_amount || 0);
          const doctorShare = total - Math.round(total * 0.15);
          const serviceName = (t.service_detail || '').toLowerCase();

          if (key === 'bintang' && serviceName.includes('bintang')) {
            gross += doctorShare;
          } else if (key === 'najib' && !serviceName.includes('bintang')) {
            gross += doctorShare;
          }
        }
      });

      // Hitung total yang sudah ditarik (SUCCESS atau PENDING)
      let withdrawn = 0;
      globalWithdrawals.forEach(w => {
        const status = (w.status || 'PENDING').toUpperCase();
        const docText = JSON.stringify(w).toLowerCase();
        const isMatchBintang = docText.includes('bintang');
        
        if ((key === 'bintang' && isMatchBintang) || (key === 'najib' && !isMatchBintang)) {
          if (status === 'SUCCESS' || status === 'PENDING' || status === 'COMPLETED' || status === 'SELESAI') {
            withdrawn += Number(w.amount || 0);
          }
        }
      });

      const netBalance = Math.max(0, gross - withdrawn);

      document.getElementById('doc-balance').innerText = `Rp ${netBalance.toLocaleString('id-ID')}`;
      document.getElementById('doc-withdrawn').innerText = `Tercairkan/Pending: Rp ${withdrawn.toLocaleString('id-ID')}`;
    }

    function loadMyWithdrawals() {
      const key = getSelectedDoctorKey();
      const listContainer = document.getElementById('withdrawal-history');
      const countBadge = document.getElementById('history-count');

      const myWithdrawals = globalWithdrawals.filter(w => {
        const docText = JSON.stringify(w).toLowerCase();
        return (key === 'bintang' && docText.includes('bintang')) || (key === 'najib' && !docText.includes('bintang'));
      });

      countBadge.innerText = `${myWithdrawals.length} Data`;

      if (myWithdrawals.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-4 text-gray-400 text-xs">Belum ada riwayat penarikan.</div>`;
        return;
      }

      listContainer.innerHTML = myWithdrawals.map(w => {
        const status = (w.status || 'PENDING').toUpperCase();
        const isPending = status === 'PENDING';
        const amount = Number(w.amount || 0);
        const dateStr = new Date(w.created_at).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
        const bankInfo = w.bank_details || w.bank_info || w.account_number || '-';

        return `
          <div class="p-2.5 rounded-xl border border-gray-200 bg-gray-50 space-y-1 text-xs">
            <div class="flex justify-between items-center">
              <span class="font-bold text-teal-900">Rp ${amount.toLocaleString('id-ID')}</span>
              <span class="px-2 py-0.5 text-[9px] font-bold rounded-full ${isPending ? 'bg-amber-100 text-amber-800' : 'bg-teal-100 text-teal-800'}">
                ${status}
              </span>
            </div>
            <p class="text-gray-600 text-[11px]">🏦 Rek: ${bankInfo}</p>
            <p class="text-[10px] text-gray-400">${dateStr}</p>
          </div>
        `;
      }).join('');
    }

    async function submitWithdrawal(e) {
      e.preventDefault();
      const name = document.getElementById('input-name').value;
      const amount = Number(document.getElementById('input-amount').value);
      const bank = document.getElementById('input-bank').value;

      if (amount <= 0) {
        alert("Nominal penarikan tidak valid.");
        return;
      }

      const { error } = await supabaseClient.from('withdrawals').insert([
        {
          doctor_name: name,
          amount: amount,
          bank_details: bank,
          status: 'PENDING'
        }
      ]);

      if (error) {
        alert("Gagal mengajukan penarikan: " + error.message);
      } else {
        alert("Pengajuan penarikan berhasil dikirim ke Admin!");
        document.getElementById('input-amount').value = '';
        document.getElementById('input-bank').value = '';
        loadDoctorWallet();
      }
    }

    loadDoctorWallet();
  </script>
</body>
      </html>
