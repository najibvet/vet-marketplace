<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Dashboard Dokter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <a href="index.html" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      ← Beranda
    </a>
    <h1 class="font-bold text-base">🩺 Dompet Dokter</h1>
    <button onclick="loadVets()" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Pilih Dokter / Identitas -->
    <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
      <label class="block text-xs font-semibold text-gray-600">Pilih Profil Dokter Anda:</label>
      <select id="select-vet" onchange="onVetSelected()" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:ring-2 focus:ring-teal-500 focus:outline-none">
        <option value="">-- Pilih Dokter --</option>
      </select>
    </div>

    <!-- Informasi Saldo -->
    <div class="bg-gradient-to-br from-teal-700 to-teal-900 text-white p-5 rounded-3xl shadow-lg space-y-4">
      <div>
        <p class="text-xs opacity-80">Saldo Siap Ditarik (85% Hak Dokter)</p>
        <p id="vet-balance" class="text-3xl font-extrabold tracking-tight mt-1">Rp 0</p>
      </div>

      <form id="withdraw-form" onsubmit="requestWithdrawal(event)" class="space-y-3 pt-2 border-t border-teal-600/50">
        <div>
          <label class="block text-[11px] opacity-90 mb-1">Nominal Penarikan (Rp)</label>
          <input type="number" id="wd-amount" required placeholder="Cth: 100000" class="w-full text-gray-900 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] opacity-90 mb-1">Tujuan Transfer (Bank / e-Wallet & No. Rekening)</label>
          <input type="text" id="wd-bank" required placeholder="Cth: BCA 1234567890 a.n. drh. Najib" class="w-full text-gray-900 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-white focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
          💸 Ajukan Penarikan Dana
        </button>
      </form>
    </div>

    <!-- Riwayat Penarikan -->
    <div class="space-y-3">
      <h2 class="font-bold text-gray-900 text-sm uppercase tracking-wider px-1">Riwayat Penarikan</h2>
      <div id="withdraw-history" class="space-y-2">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Pilih profil dokter di atas.</div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentVet = null;

    async function loadVets() {
      const select = document.getElementById('select-vet');
      const { data: vets, error } = await supabaseClient.from('vets').select('*');
      
      if (error || !vets || vets.length === 0) {
        select.innerHTML = '<option value="">Gagal memuat data dokter</option>';
        return;
      }

      select.innerHTML = '<option value="">-- Pilih Dokter --</option>' + 
        vets.map(v => {
          // Gabungkan nama dokter dan jabatannya agar jelas di pilihan
          const doctorName = v.name || v.fullname || v.doctor_name || 'Dokter';
          const doctorTitle = v.title || v.bio || v.specialization || '';
          const label = doctorTitle ? `${doctorName} (${doctorTitle})` : doctorName;
          
          return `<option value="${v.id}">${label}</option>`;
        }).join('');
    }

    async function onVetSelected() {
      const vetId = document.getElementById('select-vet').value;
      if (!vetId) {
        currentVet = null;
        document.getElementById('vet-balance').innerText = 'Rp 0';
        document.getElementById('withdraw-history').innerHTML = `<div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Pilih profil dokter di atas.</div>`;
        return;
      }

      const { data: vet } = await supabaseClient.from('vets').select('*').eq('id', vetId).single();
      if (vet) {
        currentVet = vet;
        currentVet.displayName = vet.name || vet.fullname || vet.doctor_name || 'Dokter';
        document.getElementById('vet-balance').innerText = `Rp ${Number(vet.balance || 0).toLocaleString('id-ID')}`;
        loadWithdrawals(vet.id);
      }
    }

    async function loadWithdrawals(vetId) {
      const container = document.getElementById('withdraw-history');
      const { data: wds } = await supabaseClient.from('withdrawals').select('*').eq('vet_id', vetId).order('created_at', { ascending: false });

      if (!wds || wds.length === 0) {
        container.innerHTML = `<div class="bg-white p-4 rounded-2xl border text-center text-gray-400 text-xs">Belum ada riwayat penarikan.</div>`;
        return;
      }

      container.innerHTML = wds.map(w => {
        let badgeClass = 'bg-amber-100 text-amber-800';
        if (w.status === 'approved') badgeClass = 'bg-emerald-100 text-emerald-800';
        if (w.status === 'rejected') badgeClass = 'bg-red-100 text-red-800';

        return `
          <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center text-xs">
            <div>
              <p class="font-bold text-gray-900">Rp ${Number(w.amount).toLocaleString('id-ID')}</p>
              <p class="text-[10px] text-gray-400">${w.bank_info}</p>
              <p class="text-[10px] text-gray-400">${new Date(w.created_at).toLocaleString('id-ID')}</p>
            </div>
            <span class="${badgeClass} text-[10px] px-2.5 py-1 rounded-full font-semibold uppercase">${w.status}</span>
          </div>
        `;
      }).join('');
    }

    async function requestWithdrawal(e) {
      e.preventDefault();
      if (!currentVet) {
        alert('Silakan pilih profil dokter terlebih dahulu!');
        return;
      }

      const amount = Number(document.getElementById('wd-amount').value);
      const bank = document.getElementById('wd-bank').value;

      if (amount > Number(currentVet.balance || 0)) {
        alert('Saldo tidak mencukupi untuk penarikan ini!');
        return;
      }

      const { error } = await supabaseClient.from('withdrawals').insert([
        { vet_id: currentVet.id, vet_name: currentVet.displayName, amount: amount, bank_info: bank, status: 'pending' }
      ]);

      if (error) {
        alert('Gagal mengajukan penarikan: ' + error.message);
        return;
      }

      alert('Permintaan penarikan berhasil dikirim! Admin akan memproses transfer ke rekening Anda.');
      document.getElementById('withdraw-form').reset();
      onVetSelected();
    }

    loadVets();
  </script>
</body>
</html>
