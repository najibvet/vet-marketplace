<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Dashboard Dokter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12">

  <header class="bg-teal-700 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
    <a href="index.html" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      ← Beranda
    </a>
    <h1 class="font-bold text-base">🩺 Dompet Dokter</h1>
    <button onclick="loadWithdrawals()" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-900 transition">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Form Pengajuan Penarikan Saldo -->
    <div class="bg-gradient-to-br from-teal-700 to-teal-900 text-white p-5 rounded-3xl shadow-lg space-y-4">
      <div>
        <h2 class="text-base font-bold">Form Penarikan Hak Dokter (85%)</h2>
        <p class="text-[11px] opacity-80 mt-0.5">Masukkan nama lengkap dan rincian rekening Anda untuk pencairan komisi.</p>
      </div>

      <form id="withdraw-form" onsubmit="requestWithdrawal(event)" class="space-y-3 pt-2 border-t border-teal-600/50">
        <div>
          <label class="block text-[11px] opacity-90 mb-1">Nama Lengkap & Gelar Dokter</label>
          <input type="text" id="vet-name" required placeholder="Cth: drh. Bintang Pratama" class="w-full text-gray-900 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] opacity-90 mb-1">Nominal Penarikan (Rp)</label>
          <input type="number" id="wd-amount" required placeholder="Cth: 150000" class="w-full text-gray-900 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] opacity-90 mb-1">Tujuan Transfer (Bank / e-Wallet & No. Rekening)</label>
          <input type="text" id="wd-bank" required placeholder="Cth: BCA 1234567890 a.n. drh. Bintang" class="w-full text-gray-900 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-white focus:outline-none">
        </div>
        <button type="submit" id="btn-submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
          💸 Ajukan Penarikan Dana
        </button>
      </form>
    </div>

    <!-- Riwayat Penarikan Keseluruhan -->
    <div class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="font-bold text-gray-900 text-sm uppercase tracking-wider">Riwayat Penarikan Database</h2>
        <span class="text-[10px] text-gray-400">Live Sync</span>
      </div>
      <div id="withdraw-history" class="space-y-2">
        <div class="text-center py-6 text-gray-400 text-xs bg-white rounded-2xl border">Memuat riwayat...</div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://olakgoxpurwqarxcdklr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vP3YzvR4qhHuknn_VZpSVg_QBaWFgDn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadWithdrawals() {
      const container = document.getElementById('withdraw-history');
      
      const { data: wds, error } = await supabaseClient
        .from('withdrawals')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-2xl border border-red-200 text-center text-xs">Error Database: ${error.message}</div>`;
        return;
      }

      if (!wds || wds.length === 0) {
        container.innerHTML = `<div class="bg-white p-4 rounded-2xl border text-center text-gray-400 text-xs">Belum ada riwayat penarikan di database.</div>`;
        return;
      }

      container.innerHTML = wds.map(w => {
        let badgeClass = 'bg-amber-100 text-amber-800';
        if (w.status === 'approved') badgeClass = 'bg-emerald-100 text-emerald-800';
        if (w.status === 'rejected') badgeClass = 'bg-red-100 text-red-800';

        return `
          <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center text-xs">
            <div class="space-y-0.5">
              <p class="font-bold text-gray-900">${w.vet_name}</p>
              <p class="text-teal-700 font-bold">Rp ${Number(w.amount).toLocaleString('id-ID')}</p>
              <p class="text-[10px] text-gray-500">Rek: ${w.bank_info}</p>
              <p class="text-[10px] text-gray-400">${new Date(w.created_at).toLocaleString('id-ID')}</p>
            </div>
            <span class="${badgeClass} text-[10px] px-2.5 py-1 rounded-full font-semibold uppercase">${w.status}</span>
          </div>
        `;
      }).join('');
    }

    async function requestWithdrawal(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      btn.innerText = 'Mengirim...';
      btn.disabled = true;

      const name = document.getElementById('vet-name').value;
      const amount = Number(document.getElementById('wd-amount').value);
      const bank = document.getElementById('wd-bank').value;

      const { data, error } = await supabaseClient
        .from('withdrawals')
        .insert([
          { vet_name: name, amount: amount, bank_info: bank, status: 'pending' }
        ])
        .select();

      btn.innerText = '💸 Ajukan Penarikan Dana';
      btn.disabled = false;

      if (error) {
        alert('Gagal Simpan ke Database: ' + error.message);
        return;
      }

      alert('BERHASIL! Data penarikan tersimpan di database.');
      document.getElementById('withdraw-form').reset();
      loadWithdrawals();
    }

    loadWithdrawals();
  </script>
</body>
    </html>
